<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xeumon · Nethxeum Assistant</title>
  <meta name="description" content="Xeumon, the official Nethxeum AI assistant." />
  <meta name="theme-color" content="#050510" />
  <link rel="icon" type="image/png" href="images/assistant.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-void: #040507;
      --color-deep: #07080d;
      --color-surface: #0d0f1a;
      --color-surface-2: #141624;
      --color-surface-3: #1a1d2e;
      --color-border: rgba(255, 255, 255, 0.07);
      --color-border-bright: rgba(255, 255, 255, 0.14);
      --color-text-primary: #f1f5f9;
      --color-text-secondary: #94a3b8;
      --color-text-muted: #64748b;
      --color-text-disabled: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--color-text-primary);
      background-color: var(--color-void);
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(124, 58, 237, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 60%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow: hidden;
    }

    .x-chat { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 60; background: transparent; }

    /* Header */
    .x-head {
      flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: transparent; border-bottom: 1px solid var(--color-border);
    }
    .x-head-back {
      display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
      border-radius: 10px; flex-shrink: 0; background: transparent; border: 1px solid var(--color-border-bright);
      color: var(--color-text-secondary); text-decoration: none; transition: all .15s; cursor: pointer;
    }
    .x-head-back:hover { border-color: #2dd4ff; color: #2dd4ff; box-shadow: 0 0 12px rgba(45,212,255,.2); }
    .x-head-brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .x-head-name { color: var(--color-text-primary); font-weight: 700; font-size: 15.5px; line-height: 1.2; }
    .x-head-sub { color: #8b7bc7; font-size: 12px; }
    .x-head-status { display: flex; align-items: center; gap: 7px; margin-left: auto; }
    .x-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18), 0 0 8px #34d399;
      animation: x-pulse 1.6s ease-in-out infinite;
    }
    @keyframes x-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px rgba(52,211,153,.2), 0 0 8px #34d399; }
      50% { opacity: .55; box-shadow: 0 0 0 1px rgba(52,211,153,.08), 0 0 3px #34d399; }
    }
    .x-status-txt { color: #34d399; font-size: 12px; font-weight: 500; }

    /* Avatar */
    .x-avatar {
      border-radius: 50%; border: 1.5px solid rgba(45, 212, 255, 0.55);
      box-shadow: 0 0 0 1px rgba(124, 58, 237, 0.25), 0 0 14px rgba(45, 212, 255, 0.28), inset 0 0 8px rgba(124, 58, 237, 0.2);
      overflow: hidden; flex-shrink: 0;
    }
    .x-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .x-avatar--head { width: 38px; height: 38px; position: relative; }
    .x-avatar--msg { width: 34px; height: 34px; margin-top: 2px; align-self: flex-end; }

    /* Zone messages */
    .x-body { flex: 1; min-height: 0; position: relative; }
    .x-msgs {
      position: absolute; inset: 0; overflow-y: auto; padding: 18px 14px;
      display: flex; flex-direction: column; gap: 6px;
      max-width: 860px; margin: 0 auto; width: 100%;
      scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: rgba(124, 58, 237, 0.25) transparent;
    }
    .x-row { display: flex; align-items: flex-end; gap: 10px; width: 100%; animation: x-in .25s cubic-bezier(.16,1,.3,1); }
    @keyframes x-in { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
    .x-row--user { justify-content: flex-end; }

    /* Bulles */
    .x-bubble-wrap { display: flex; flex-direction: column; align-items: flex-start; max-width: 100%; flex: 0 1 auto; }
    .x-row--user .x-bubble-wrap { align-items: flex-end; }
    .x-bubble {
      position: relative; max-width: 100%; width: fit-content; min-width: 0; padding: 12px 16px 10px;
      font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; box-sizing: border-box;
    }
    .x-bubble--user {
      background: transparent; border: 1px solid rgba(139, 92, 246, 0.5); color: var(--color-text-primary);
      border-radius: 16px 16px 7px 16px;
    }
    .x-bubble--user::after {
      content: ""; position: absolute; bottom: -1px; right: -4px; border: 5px solid transparent;
      border-left: 7px solid rgba(139, 92, 246, 0.6); border-bottom: 1px solid rgba(139, 92, 246, 0.5);
    }
    .x-bubble--bot {
      background: transparent; border: 1px solid rgba(45, 212, 255, 0.3); color: var(--color-text-primary);
      border-radius: 16px 16px 16px 7px;
    }
    .x-bubble--bot::before {
      content: ""; position: absolute; top: -1px; left: -4px; border: 5px solid transparent;
      border-right: 7px solid rgba(45, 212, 255, 0.4); border-top: 1px solid rgba(45, 212, 255, 0.3);
    }
    .x-bubble--typing { padding: 14px 16px; display: flex; gap: 6px; align-items: center; }
    .x-bubble--typing span { width: 6px; height: 6px; border-radius: 50%; background: #a78bfa; animation: x-type 1.2s ease-in-out infinite; }
    .x-bubble--typing span:nth-child(2) { animation-delay: .2s; }
    .x-bubble--typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes x-type { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    .x-meta { font-size: 10.5px; color: var(--color-text-muted); display: flex; align-items: center; gap: 4px; margin-top: 3px; padding: 0 4px; }
    .x-meta--user { justify-content: flex-end; }
    .x-tick { color: #8b5cf6; margin-left: 2px; font-size: 11px; }

    .chat-link { color: #38bdf8; text-decoration: underline; text-decoration-color: rgba(56, 189, 248, 0.3); word-break: break-all; overflow-wrap: anywhere; }
    .x-bubble--bot .chat-link { color: #7c3aed; }

    /* Barre de saisie */
    .x-run {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-top: 1px solid var(--color-border); background: transparent;
    }
    .x-run input {
      flex: 1; min-width: 0; height: 38px; background: transparent; border: 1px solid var(--color-border-bright);
      border-radius: 12px; color: var(--color-text-primary); font-size: 13.5px; padding: 0 14px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .x-run input::placeholder { color: var(--color-text-muted); }
    .x-run input:focus { border-color: #2dd4ff; box-shadow: 0 0 0 2px rgba(45, 212, 255, 0.13), 0 0 16px rgba(124, 58, 237, 0.12); }
    .x-run input:disabled { opacity: 0.45; }
    .x-send {
      width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 55%, #2563eb 100%); border: 1px solid #8b5cf6;
      color: #fff; cursor: pointer; transition: all .15s; box-shadow: 0 0 14px rgba(124, 58, 237, 0.35);
    }
    .x-send:hover:not(:disabled) { background: linear-gradient(135deg, #8b5cf6, #2dd4ff); border-color: #2dd4ff; box-shadow: 0 0 22px rgba(45, 212, 255, 0.35); }
    .x-send:disabled { opacity: 0.35; }

    @media (max-width: 480px) {
      .x-head { padding: 10px 12px; }
      .x-head-name { font-size: 14.5px; }
      .x-bubble { font-size: 13px; padding: 11px 14px 9px; }
      .x-run { padding: 8px 10px; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="x-chat">
    <header class="x-head">
      <a class="x-head-back" href="/" aria-label="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="x-head-brand">
        <div class="x-avatar x-avatar--head"><img src="images/assistant.png" alt="Xeumon" /></div>
        <div>
          <div class="x-head-name">Xeumon</div>
          <div class="x-head-sub">Nethxeum AI Assistant</div>
        </div>
      </div>
      <div class="x-head-status">
        <span class="x-dot"></span>
        <span class="x-status-txt">Online</span>
      </div>
    </header>

    <main class="x-body">
      <div class="x-msgs" id="x-msgs">
        <div id="x-end"></div>
      </div>
    </main>

    <footer class="x-run">
      <input id="x-input" type="text" placeholder="Écrivez votre message…" autocomplete="off" spellcheck="false" />
      <button class="x-send" id="x-send" type="button" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </footer>
  </div>

  <script>
  (function () {
    'use strict';

    var API_URL = 'https://explore.nethxeum.com/api/assistant/chat';
    var API_KEY = 'jir63n28vug95behsqofwmpaytk47dczxl10';

    var msgs = document.getElementById('x-msgs');
    var endEl = document.getElementById('x-end');
    var input = document.getElementById('x-input');
    var sendBtn = document.getElementById('x-send');

    var sending = false;
    var history = [];

    function now() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function clean(t) {
      if (typeof t !== 'string') return String(t);
      return t
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/__(.+?)__/g, '$1')
        .replace(/_(.+?)_/g, '$1')
        .replace(/`{1,3}([^`]+)`{0,3}/g, '$1')
        .replace(/^#{1,6}\s*/gm, '')
        .replace(/^\s*[-*]\s+/gm, '• ')
        .trim();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function linkify(text) {
      var esc = escapeHtml(text);
      return esc.replace(
        /(https?:\/\/[^\s<>"'(){}]+|discord\.gg\/[A-Za-z]+|t\.me\/[A-Za-z0-9_]+|@\w+|github\.com\/[A-Za-z0-9_.-]+)/g,
        function (m) {
          var url = m;
          if (!/^https?:/i.test(url)) {
            url = m.charAt(0) === '@' ? 'https://x.com/' + m.slice(1) : 'https://' + m;
          }
          return '<a href="' + url + '" target="_blank" rel="noopener" class="chat-link">' + m + '</a>';
        }
      );
    }

    function scrollBottom() {
      endEl.scrollIntoView({ behavior: 'smooth' });
    }

    function push(role, content) {
      history.push({ role: role, content: content, at: now() });
      if (history.length > 20) history = history.slice(-20);
      try { sessionStorage.setItem('xeumon-history', JSON.stringify(history)); } catch (_) {}
    }

    function addBubble(role, content) {
      var row = document.createElement('div');
      row.className = 'x-row' + (role === 'user' ? ' x-row--user' : '');

      var avatar = '';
      if (role === 'assistant') {
        var a = document.createElement('div');
        a.className = 'x-avatar x-avatar--msg';
        a.innerHTML = '<img src="images/assistant.png" alt="Xeumon"/>';
        row.appendChild(a);
      }

      var wrap = document.createElement('div');
      wrap.className = 'x-bubble-wrap';

      var bubble = document.createElement('div');
      bubble.className = 'x-bubble ' + (role === 'user' ? 'x-bubble--user' : 'x-bubble--bot');
      bubble.innerHTML = linkify(clean(content));
      wrap.appendChild(bubble);

      var meta = document.createElement('div');
      meta.className = 'x-meta' + (role === 'user' ? ' x-meta--user' : '');
      if (role === 'user') {
        meta.innerHTML = now() + ' <span class="x-tick">✓✓</span>';
      } else {
        meta.textContent = now();
      }
      wrap.appendChild(meta);

      row.appendChild(wrap);
      msgs.insertBefore(row, endEl);
      scrollBottom();
    }

    function addTyping() {
      var row = document.createElement('div');
      row.className = 'x-row';
      row.id = 'typing-row';

      var a = document.createElement('div');
      a.className = 'x-avatar x-avatar--msg';
      a.innerHTML = '<img src="images/assistant.png" alt="Xeumon"/>';
      row.appendChild(a);

      var b = document.createElement('div');
      b.className = 'x-bubble x-bubble--bot x-bubble--typing';
      b.innerHTML = '<span></span><span></span><span></span>';
      row.appendChild(b);

      msgs.insertBefore(row, endEl);
      scrollBottom();
      return row;
    }

    function removeTyping() {
      var t = document.getElementById('typing-row');
      if (t) t.remove();
    }

    function send() {
      var text = input.value.trim();
      if (!text || sending) return;
      sending = true;
      sendBtn.disabled = true;
      input.disabled = true;

      addBubble('user', text);
      push('user', text);
      input.value = '';

      var typing = addTyping();

      var timezone;
      try { timezone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (_) {}

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
        body: JSON.stringify({ message: text, history: history, timezone: timezone })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          removeTyping();
          var reply = (data && data.reply) ? data.reply : 'No answer.';
          addBubble('assistant', reply);
          push('assistant', reply);
        })
        .catch(function () {
          removeTyping();
          addBubble('assistant', 'Erreur réseau — réessaie dans un moment.');
          push('assistant', 'Erreur réseau — réessaie dans un moment.');
        })
        .finally(function () {
          sending = false;
          sendBtn.disabled = false;
          input.disabled = false;
          input.focus();
        });
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // init
    try {
      var saved = JSON.parse(sessionStorage.getItem('xeumon-history') || '[]');
      if (saved && saved.length) {
        history = saved;
        saved.forEach(function (m) { addBubble(m.role, m.content); });
      }
    } catch (_) { history = []; }

    if (!history.length) {
      addBubble('assistant', 'Hello! I am Xeumon, the official Nethxeum assistant. Ask me about the network, blocks, transactions, privacy, or mining.');
      push('assistant', 'Hello! I am Xeumon, the official Nethxeum assistant. Ask me about the network, blocks, transactions, privacy, or mining.');
    }
  })();
  </script>
</body>
</html>
