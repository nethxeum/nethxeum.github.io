<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Assistant — Xeumon · Nethxeum</title>
<link href="../favicon.svg" rel="icon" type="image/svg+xml"/>
<style>
html, body { height: 100%; margin: 0; padding: 0; }
body { overflow: hidden; background: transparent; font-family: "Inter","Segoe UI", system-ui, sans-serif; color: #EEF2FF; }
* { box-sizing: border-box; }

/* Header */
.x-head { position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid rgba(124,58,237,.25);
  background: rgba(8,10,24,.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.x-back { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:10px; border:1px solid rgba(124,58,237,.35); color:#a78bfa; text-decoration:none; }
.x-head-name { font-weight:700; font-size:15px; }
.x-head-sub { font-size:12px; color:#8b7bc7; }
.x-dot { width:8px; height:8px; border-radius:50%; background:#34d399; box-shadow:0 0 0 3px rgba(52,211,153,.25),0 0 10px #34d399; }
.x-status-txt { color:#34d399; font-size:11.5px; }

/* Zone messages */
.x-msgs { position: absolute; top: 52px; left: 0; right: 0; bottom: 70px; overflow-y: auto;
  padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.x-row { display: flex; align-items: flex-end; gap: 8px; }
.x-user { flex-direction: row-reverse; }
.x-bundle { display: flex; flex-direction: column; max-width: calc(100% - 44px); }
.x-msg { padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.5;
  white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
  position: relative; }
.x-msg--user { background: linear-gradient(135deg, rgba(124,58,237,.85), rgba(55,48,163,.9)); color: #fff; border-radius: 16px 16px 4px 16px; }
.x-msg--bot { background: rgba(10,12,32,.72); border: 1px solid rgba(45,212,255,.14); color: #EEF2FF; border-radius: 16px 16px 16px 4px; }
.x-time { font-size: 10.5px; color: rgba(139,155,178,.8); margin-top: 4px; }
.x-row.x-user .x-time { align-self: flex-end; }
.x-tick { color: #8b5cf6; font-size: 10.5px; margin-left: 4px; }

/* Barre de saisie — fixée, translucide */
.x-run { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom,0)) 10px;
  background: rgba(8,10,24,.55); backdrop-filter: blur(12px);
  border-top: 1px solid rgba(124,58,237,.25); }
.x-plus { width: 36px; height: 36px; border-radius: 10px; flex-shrink:0; cursor:pointer;
  background: rgba(124,58,237,.18); border: 1px solid rgba(124,58,237,.4); color:#a78bfa; }
.x-plus:hover { background: rgba(124,58,237,.32); border-color: #45d0ff; }
.x-input { flex: 1; min-width: 0; height: 40px; padding: 0 14px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(124,58,237,.38);
  border-radius: 20px; color:#EEF2FF; font-size: 14px; font-family: inherit; outline: none;
  caret-color:#7c4dff; -webkit-appearance: none; appearance: none;
}
.x-input::placeholder { color: rgba(139,155,178,.6); }
.x-input:focus { border-color: rgba(45,212,255,.6); box-shadow: 0 0 0 3px rgba(45,212,255,.14), 0 0 22px rgba(124,58,237,.18); }
.x-send { width: 40px; height: 40px; border-radius: 50%; flex-shrink:0; cursor: pointer; border: none;
  background: linear-gradient(135deg,#7c3aed,#2563eb); color: #fff; }
.x-send:disabled { opacity:.35; }
.x-send:not(:disabled):hover { box-shadow: 0 0 16px rgba(45,212,255,.4); }
.x-mt { margin-top: 52px; }
</style>
</head>
<body>

<div class="x-head">
  <a class="x-back" href="../index.html" aria-label="Retour"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
    <div style="width:36px;height:36px;border-radius:50%;overflow:hidden;border:1px solid rgba(45,212,255,.5);flex-shrink:0;"><img src="../images/assistant.png" style="width:100%;height:100%;object-fit:cover" alt="Xeumon"/></div>
    <div><div class="x-head-name">Xeumon</div><div class="x-head-sub">Assistante officielle Nethxeum</div></div>
  </div>
  <div class="x-status-txt"><div class="x-dot"></div> En ligne</div>
</div>

<div class="x-msgs" id="nxy-msgs"></div>

<form class="x-run" id="nxy-form">
  <button class="x-plus" type="button" aria-label="Plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
  <input class="x-input" id="nxy-input" type="text" autocomplete="off" placeholder="Écrivez votre message…"/>
  <button class="x-send" id="nxy-send" type="submit" aria-label="Envoyer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</form>

<script>
(function(){
  function cls(t){return (t||'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1').replace(/__(.+?)__/g,'$1').replace(/_(.+?)_/g,'$1').replace(/`{1,3}([^']+)`{0,3}/g,'$1').replace(/^#{1,6}\s*/gm,'').replace(/^\s*[-*]\s+/gm,'• ').trim();}
  function now(){var d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function linkify(s){return esc(s).replace(/(https?:\/\/\S+|discord\.gg\/\S+|t\.me\/\S+|github\.com\/\S+|@\w+)/g,m=>{var u=/^https?:/i.test(m)?m:('https://'+m);return '<a href="'+u+'" target="_blank" rel="noopener" style="color:#8b5cf6;text-decoration:underline;word-break:break-all;">'+m+'</a>';});}

  var msgs=document.getElementById('nxy-msgs'), input=document.getElementById('nxy-input'), form=document.getElementById('nxy-form');
  function addMsg(role,text){
    var time=now();
    var row=document.createElement('div'); row.className='x-row'+(role==='user'?' x-user':'');
    var bundle=document.createElement('div'); bundle.className='x-bundle';
    var bub=document.createElement('div'); bub.className='x-msg '+(role==='user'?'x-msg--user':'x-msg--bot'); bub.innerHTML=linkify(cls(text));
    var tm=document.createElement('div'); tm.className='x-time'; tm.textContent=time+(role==='user'?' ✓✓':'');
    if(role==='user') tm.style.alignSelf='flex-end';
    bundle.appendChild(bub); bundle.appendChild(tm); row.appendChild(bundle); msgs.appendChild(row);
    msgs.scrollTop=msgs.scrollHeight;
  }
  var hist=[];
  try{hist=JSON.parse(sessionStorage.getItem('xeumon-history')||'[]');}catch(e){hist=[];}
  hist.forEach(function(m){addMsg(m.role==='user'?'user':'assistant',m.content);});
  if(!hist.length){addMsg('assistant','Bonjour ! Je suis Xeumon, l\'assistante de Nethxeum. Je connais la chaîne en direct (blocs, transactions, hashrate) et le projet. Pose-moi une question.');}
  form.addEventListener('submit',function(e){e.preventDefault();var txt=input.value.trim();if(!txt)return;addMsg('user',txt);input.value='';input.disabled=true;document.getElementById('nxy-send').disabled=true;
    var typing=document.createElement('div');typing.className='x-row';typing.id='typing';typing.innerHTML='<div class="x-bundle"><div class="x-msg x-msg--bot">…</div></div>';msgs.appendChild(typing);msgs.scrollTop=msgs.scrollHeight;
    fetch('https://explore.nethxeum.com/api/assistant/chat',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':'jir63n28vug95behsqofwmpaytk47dczxl10'},body:JSON.stringify({message:txt,history:hist})})
      .then(r=>r.json()).then(d=>{typing.remove();var resp=d.reply||'Pas de réponse.';addMsg('assistant',resp);hist.push({role:'user',content:txt});hist.push({role:'assistant',content:resp});sessionStorage.setItem('xeumon-history',JSON.stringify(hist));})
      .catch(()=>{typing.remove();addMsg('assistant','Erreur réseau — réessaie.');})
      .finally(()=>{input.disabled=false;document.getElementById('nxy-send').disabled=false;input.focus();});
  });
})();
</script>
</body>
</html>
