<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Xeumon — Assistant Nethxeum</title>
<meta content="Xeumon, l'assistante officielle de Nethxeum." name="description"/>
<link href="../favicon.svg" rel="icon" type="image/svg+xml"/>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Inter", system-ui, -apple-system, sans-serif; }

/* ═══════════════════════════════════════════════════════════
   XEUMON — chat futuriste cyber (copie conforme de l'explorateur)
   ═══════════════════════════════════════════════════════════ */

.x-chat {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: transparent;
  z-index: 60;
}

/* ── Header fixe ── */
.x-head {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: linear-gradient(135deg, rgba(10, 10, 24, 0.82), rgba(16, 12, 32, 0.85));
  border-bottom: 1px solid rgba(124, 58, 237, 0.22);
  box-shadow: 0 1px 0 rgba(45, 212, 255, 0.07), 0 2px 24px rgba(124, 58, 237, 0.06);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.x-head-back {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 10px;
  background: transparent; border: 1px solid rgba(124, 58, 237, 0.28);
  color: #94a3b8; text-decoration: none; transition: all .15s;
  flex-shrink: 0;
}
.x-head-back:hover { border-color: #2dd4ff; color: #2dd4ff; box-shadow: 0 0 12px rgba(45,212,255,.2); }
.x-head-brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.x-head-name { color: #eef2ff; font-weight: 700; font-size: 15.5px; line-height: 1.2; letter-spacing: .1px; }
.x-head-sub  { color: #8b7bc7; font-size: 12px; letter-spacing: .2px; }
.x-head-status { display: flex; align-items: center; gap: 7px; margin-left: auto; }
.x-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18), 0 0 8px #34d399;
  animation: x-pulse 1.6s ease-in-out infinite;
}
@keyframes x-pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 3px rgba(52,211,153,.2), 0 0 8px #34d399; }
                     50% { opacity: .55; box-shadow: 0 0 0 1px rgba(52,211,153,.08), 0 0 3px #34d399; } }
.x-status-txt { color: #34d399; font-size: 12px; font-weight: 500; letter-spacing: .3px; }
.x-head-menu {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 10px;
  background: transparent; border: 1px solid rgba(124, 58, 237, 0.18);
  color: #8b7bc7; cursor: pointer; transition: all .15s;
  flex-shrink: 0;
}
.x-head-menu:hover { border-color: rgba(45, 212, 255, .55); color: #2dd4ff; }

/* ── Avatar ── */
.x-avatar {
  position: relative;
  border-radius: 50%;
  border: 1.5px solid rgba(45, 212, 255, 0.55);
  box-shadow:
    0 0 0 1px rgba(124, 58, 237, 0.25),
    0 0 14px rgba(45, 212, 255, 0.28),
    inset 0 0 8px rgba(124, 58, 237, 0.2);
  overflow: hidden;
  flex-shrink: 0;
}
.x-avatar img { width: 100%; height: 100%; object-fit: cover; }
.x-avatar--head { width: 38px; height: 38px; }
.x-avatar-ring {
  position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid rgba(45, 212, 255, 0.25);
  animation: x-ring 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes x-ring { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.x-avatar--msg { width: 34px; height: 34px; margin-top: 2px; }

/* ── Zone messages ── */
.x-body { flex: 1; min-height: 0; position: relative; }
.x-bg-grid {
  position: absolute; inset: 0; pointer-events: none; opacity: .4;
  background-image:
    radial-gradient(circle at 18% 0%, rgba(124, 58, 237, 0.07) 0%, transparent 30%),
    radial-gradient(circle at 82% 105%, rgba(45, 212, 255, 0.05) 0%, transparent 30%),
    linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
}
.x-msgs {
  position: absolute; inset: 0; overflow-y: auto;
  padding: 18px 14px 18px;
  display: flex; flex-direction: column; gap: 6px;
  max-width: 860px; margin: 0 auto; width: 100%;
  scroll-behavior: smooth;
  scrollbar-width: thin; scrollbar-color: rgba(124, 58, 237, 0.25) transparent;
}
.x-row {
  display: flex; align-items: flex-end; gap: 10px;
  animation: x-in .25s cubic-bezier(.16,1,.3,1);
}
@keyframes x-in { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.x-row--user { justify-content: flex-end; }

.x-bubble-wrap { display: flex; flex-direction: column; max-width: calc(100% - 50px); }

/* ── Bulles ── */
.x-bubble {
  position: relative;
  max-width: min(78%, 70ch);
  padding: 12px 16px 10px;
  font-size: 13.5px; line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere; word-break: break-word;
  box-sizing: border-box;
}
.x-bubble--user {
  background: linear-gradient(135deg, rgba(46, 16, 101, 0.88) 0%, rgba(12, 10, 32, .92) 70%);
  border: 1px solid rgba(168, 85, 247, 0.5);
  color: #f4f1ff;
  border-radius: 16px 16px 7px 16px;
  box-shadow: 0 4px 18px rgba(124, 58, 237, 0.22), inset 0 1px 0 rgba(255,255,255,.06);
}
.x-bubble--user::after {
  content: ""; position: absolute; bottom: -1px; right: -4px;
  border: 5px solid transparent;
  border-left: 7px solid rgba(46, 16, 101, 0.94);
  border-bottom: 1px solid rgba(168, 85, 247, 0.5);
}
.x-bubble--bot {
  background: linear-gradient(135deg, rgba(8, 8, 24, 0.82), rgba(14, 12, 30, 0.78));
  border: 1px solid transparent;
  border-radius: 16px 16px 16px 7px;
  color: #eef2ff;
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.14), 0 0 0 1px rgba(45, 212, 255, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  background-clip: padding-box;
  border-image: linear-gradient(135deg, rgba(45,212,255,.45), rgba(124,58,237,.35)) 1;
}
.x-bubble--bot::before {
  content: ""; position: absolute; top: -1px; left: -4px;
  border: 5px solid transparent; border-right: 7px solid rgba(8, 8, 24, 0.95);
  border-top: 1px solid rgba(45, 212, 255, 0.35);
}
.x-bubble--typing { padding: 14px 16px; display: flex; gap: 6px; align-items: center; }
.x-bubble--typing span {
  width: 6px; height: 6px; border-radius: 50%; background: #a78bfa;
  animation: x-type 1.2s ease-in-out infinite;
}
.x-bubble--typing span:nth-child(2) { animation-delay: .2s; }
.x-bubble--typing span:nth-child(3) { animation-delay: .4s; }
@keyframes x-type { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* Timestamp */
.x-meta { font-size: 10.5px; color: rgba(139,155,178,.85); display: flex; align-items: center; gap: 5px; margin-top: 3px; }
.x-meta--user { justify-content: flex-end; }
.x-tick { color: #8b5cf6; margin-left: 4px; font-size: 11px; }

.chat-link { color: #7dd3fc; text-decoration: underline; text-decoration-color: rgba(125, 211, 252, 0.3); word-break: break-all; overflow-wrap: anywhere; }
.x-bubble--user .chat-link { color: #e2d2ff; }
.x-bubble--bot  .chat-link { color: #8b7afc; }

/* ── Barre de saisie ── */
.x-run {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-top: 1px solid rgba(124, 58, 237, 0.2);
  background: rgba(6, 6, 18, 0.78);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.x-plus {
  width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid rgba(124, 58, 237, 0.35);
  color: #8b7bc7; cursor: pointer; transition: all .15s;
}
.x-plus:hover:not([disabled]) { border-color: #2dd4ff; color: #2dd4ff; box-shadow: 0 0 10px rgba(45,212,255,.25); }
.x-plus:disabled { opacity: 0.35; }
.x-run input {
  flex: 1;
  height: 38px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(124, 58, 237, 0.3);
  border-radius: 12px;
  color: #eef2ff;
  font-size: 13.5px;
  padding: 0 14px;
  outline: none;
  appearance: none; -webkit-appearance: none;
  transition: border-color .15s, box-shadow .15s;
}
.x-run input::placeholder { color: rgba(139, 158, 176, 0.6); }
.x-run input:focus {
  border-color: rgba(45, 212, 255, 0.55);
  box-shadow: 0 0 0 2px rgba(45, 212, 255, 0.13), 0 0 16px rgba(124, 58, 237, 0.12);
}
.x-run input:disabled { opacity: 0.45; }
.x-send {
  width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 55%, #2563eb 100%);
  border: 1px solid rgba(139, 92, 246, 0.75);
  color: #fff; cursor: pointer; transition: all .15s;
  box-shadow: 0 0 14px rgba(124, 58, 237, 0.35);
}
.x-send:hover:not(:disabled) {
  background: linear-gradient(135deg, #8b5cf6, #2dd4ff);
  border-color: rgba(45, 212, 255, 0.7);
  box-shadow: 0 0 22px rgba(45, 212, 255, 0.35), inset 0 1px 0 rgba(255,255,255,.15);
}
.x-send:disabled { opacity: 0.35; }

@media (max-width: 480px) {
  .x-head { padding: 10px 12px; }
  .x-head-name { font-size: 14.5px; }
  .x-bubble { max-width: 82%; font-size: 13px; padding: 11px 14px 9px; }
  .x-run { padding: 8px 10px; gap: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
}
</style>
</head>
<body>

<div class="x-chat">
  <!-- HEADER -->
  <header class="x-head">
    <a class="x-head-back" href="../index.html" aria-label="Retour">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="x-head-brand">
      <div class="x-avatar x-avatar--head">
        <img src="../images/assistant.png" alt="Xeumon"/>
        <span class="x-avatar-ring"></span>
      </div>
      <div>
        <div class="x-head-name">Xeumon</div>
        <div class="x-head-sub">IA Assistant de Nethxeum</div>
      </div>
    </div>
    <div class="x-head-status"><span class="x-dot"></span><span class="x-status-txt">En ligne</span></div>
    <button class="x-head-menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>
  </header>

  <!-- CONVERSATION -->
  <main class="x-body">
    <div class="x-bg-grid" aria-hidden="true"></div>
    <div class="x-msgs" id="x-msgs"></div>
  </main>

  <!-- SAISIE -->
  <footer class="x-run">
    <button class="x-plus" type="button" aria-label="Ajouter" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <input id="x-input" type="text" placeholder="Écrivez votre message…" autocomplete="off" spellcheck="false"/>
    <button class="x-send" id="x-send" type="button" aria-label="Envoyer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var API = 'https://explore.nethxeum.com/api/assistant/chat';
  var API_KEY = 'jir63n28vug95behsqofwmpaytk47dczxl10';
  var msgs = document.getElementById('x-msgs');
  var input = document.getElementById('x-input');
  var sendBtn = document.getElementById('x-send');

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function clean(t) {
    return (t || '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/__(.+?)__/g, '$1')
      .replace(/_(.+?)_/g, '$1')
      .replace(/`{1,3}([^`]+)`{0,3}/g, '$1')
      .replace(/^#{1,6}\s*/gm, '')
      .replace(/^\s*[-*]\s+/gm, '• ')
      .trim();
  }

  function linkify(text) {
    var esc = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    return esc.replace(
      /(https?:\/\/[^\s<>"'(){}]+|discord\.gg\/[A-Za-z]+|t\.me\/[A-Za-z0-9_]+|@\w+|github\.com\/[A-Za-z0-9_.-]+)/g,
      function (m) {
        var url = m;
        if (!/^https?:/i.test(url)) {
          url = m.charAt(0) === '@' ? 'https://x.com/' + m.slice(1) : 'https://' + m;
        }
        return '<a href="' + url + '" target="_blank" rel="noopener" class="chat-link">' + m + '</a>';
      }
    );
  }

  function addMsg(role, content, at) {
    var row = document.createElement('div');
    row.className = 'x-row' + (role === 'user' ? ' x-row--user' : '');
    if (role === 'assistant') {
      row.innerHTML = '<div class="x-avatar x-avatar--msg"><img src="../images/assistant.png" alt="Xeumon"/></div>';
    }
    var wrap = document.createElement('div');
    wrap.className = 'x-bubble-wrap';
    wrap.innerHTML =
      '<div class="x-bubble ' + (role === 'user' ? 'x-bubble--user' : 'x-bubble--bot') + '">' + linkify(content) + '</div>' +
      '<div class="x-meta' + (role === 'user' ? ' x-meta--user' : '') + '">' + at +
        (role === 'user' ? '<span class="x-tick">✓✓</span>' : '') + '</div>';
    row.appendChild(wrap);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addTyping() {
    var row = document.createElement('div');
    row.className = 'x-row';
    row.id = 'x-typing';
    row.innerHTML =
      '<div class="x-avatar x-avatar--msg"><img src="../images/assistant.png" alt="Xeumon"/></div>' +
      '<div class="x-bubble x-bubble--bot x-bubble--typing"><span></span><span></span><span></span></div>';
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function removeTyping() {
    var t = document.getElementById('x-typing');
    if (t) t.remove();
  }

  // Historique de session
  var messages = [];
  try { messages = JSON.parse(sessionStorage.getItem('xeumon-history') || '[]'); } catch (e) { messages = []; }
  messages.forEach(function (m) {
    addMsg(m.role === 'user' ? 'user' : 'assistant', m.content, m.at || now());
  });
  if (!messages.length) {
    var hello = 'Hello! I am Xeumon, the official Nethxeum assistant. Ask me about the network, blocks, transactions, privacy, or mining.';
    addMsg('assistant', hello, now());
    messages.push({ role: 'assistant', content: hello, at: now() });
    try { sessionStorage.setItem('xeumon-history', JSON.stringify(messages)); } catch (e) {}
  }

  function persist() {
    var keep = messages.slice(-20);
    try { sessionStorage.setItem('xeumon-history', JSON.stringify(keep)); } catch (e) {}
  }

  function send() {
    var text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    var at = now();
    addMsg('user', text, at);
    messages.push({ role: 'user', content: text, at: at });
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    addTyping();

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
      body: JSON.stringify({ message: text, history: messages })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        removeTyping();
        var reply = clean((d && d.reply) || 'No answer.');
        addMsg('assistant', reply, now());
        messages.push({ role: 'assistant', content: reply, at: now() });
        persist();
      })
      .catch(function () {
        removeTyping();
        addMsg('assistant', 'Erreur réseau — réessaie dans un moment.', now());
      })
      .finally(function () {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      });
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
  });
})();
</script>
<script src="../js/nxy-assistant.js"></script>
</body>
</html>
