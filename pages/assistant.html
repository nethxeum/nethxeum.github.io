<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Assistant — Xeumon · Nethxeum</title>
<link href="../css/main.css" rel="stylesheet"/>
<link href="../favicon.svg" rel="icon" type="image/svg+xml"/>
</head>
<body>

<style>
/* ─── Chat chat over the site''s animated background ─────── */
.x-shell {
  position: fixed;
  inset: 0;               /* taille fout de chat qui remplit tout l'écran */
  display: flex;
  flex-direction: column;
  z-index: 20;
  background: transparent; /* le thème animé du site brille derrière */
}
/* Header : la même palette, légèrement translucide pour laisser voir le fond */
.x-head {
  flex-shrink: 0; display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: rgba(6, 11, 31, .38);
  border-bottom: 1px solid rgba(124, 58, 237, .25);
  backdrop-filter: blur(10px);
}
.x-back { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
  border-radius:10px; border:1px solid rgba(124,58,237,.35); color:rgba(139,155,178,.85); text-decoration:none;
}
.x-back:hover { border-color:#2dd4ff; color:#2dd4ff; }
.x-avatar { width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(45,212,255,.55);
  box-shadow:0 0 12px rgba(45,212,255,.3); overflow:hidden; flex-shrink:0; }
.x-avatar img { width:100%; height:100%; object-fit:cover; }
.x-head-name { color:#eef2ff; font-weight:700; font-size:15px; }
.x-head-sub  { color:#8b7bc7; font-size:11.5px; letter-spacing:.2px; }
.x-status { margin-left:auto; display:flex; align-items:center; gap:7px; }
.x-dot { width:8px; height:8px; border-radius:50%; background:#34d399;
  box-shadow:0 0 0 3px rgba(52,211,153,.25), 0 0 8px #34d399; animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.x-status-txt { color:#34d399; font-size:11.5px; }

/* Zone messages: conservée ENTIEREMENT transparente */
.x-msgs {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  padding: 14px 12px; scroll-behavior: smooth;
  scrollbar-width: thin; scrollbar-color: rgba(124,58,237,.3) transparent;
}

.x-row { display: flex; align-items: flex-end; gap: 10px; animation: x-in .25s ease; }
.x-user { flex-direction: row-reverse; }
@keyframes x-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.x-msg-bundle { display: flex; flex-direction: column; max-width: calc(100% - 46px); }

.x-meta { font-size: 10.5px; color: rgba(139,155,178,.85); margin-top: 4px; display: flex; align-items: center; gap: 5px; }
.x-meta--user { justify-content: flex-end; }
.x-tick { color: #8b5cf6; font-size: 11px; }

.x-bubble {
  position: relative;
  padding: 10px 14px; font-size: 13.5px; line-height: 1.55;
  white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; box-sizing: border-box;
}

/* Bulle Xeumon : couleur du thème Nethxeum mais légèrement transparente */
.x-bubble--bot {
  background: rgba(20, 18, 40, .75);
  border: 1px solid rgba(45, 212, 255, .35);
  color: #eef2ff;
  border-radius: 16px 16px 16px 5px;
  box-shadow: 0 4px 16px rgba(124,58,237,.12);
}
.x-bubble--bot::before { content:""; position:absolute; left:-5px; top:12px;
  border:6px solid transparent; border-right-color:rgba(20,18,40,.75); }

/* Bulle utilisateur : du gradient foncé violet du site */
.x-bubble--user {
  background: linear-gradient(135deg, rgba(59,34,109,.9), rgba(34,21,74,.85));
  border: 1px solid rgba(168,85,247,.5);
  color: #fff;
  border-radius: 16px 16px 5px 16px;
  box-shadow: 0 4px 16px rgba(124,58,237,.18);
}
.x-bubble--user::after { content:""; position:absolute; right:-5px; bottom:0;
  border:6px solid transparent; border-left-color:rgba(34,21,74,.85); }

.chat-link { color: #8b5cf6 !important; text-decoration: underline; text-decoration-color: rgba(139,92,246,.45); word-break: break-all; }

/* Barre de saisie : translucide, laisse respirer le fond
.x-run { flex-shrink:0; display:flex; gap:10px; padding:12px 14px;
  background: rgba(6, 11, 31, .38); border-top: 1px solid rgba(124,58,237,.25);
  backdrop-filter: blur(12px);
}
.x-input{ flex:1; height:46px; padding:0 18px;
  background: rgba(10, 15, 32, .55);
  border: 1px solid rgba(124, 58, 237, .4);
  border-radius: 14px;
  color: #eef2ff;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.3),
    0 0 0 1px rgba(124,58,237,.06);
  backdrop-filter: blur(8px);
  transition: all .2s ease;
}
.x-input::placeholder { color: rgba(139,155,178,.55); letter-spacing: .2px; }
.x-input:focus {
  border-color: rgba(45, 212, 255, .6);
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.3),
    0 0 0 3px rgba(45, 212, 255, .12),
    0 0 24px rgba(124, 58, 237, .16),
    inset 0 0 24px rgba(124, 58, 237, .这个产品呢05);
}


.x-send { width: 40px; height: 40px; flex-shrink:0; border:0; border-radius:12px;
  background: linear-gradient(135deg,#7c3aed,#1756e0); color:#fff; cursor:pointer;
  box-shadow: 0 0 12px rgba(124,58,237,.35);
}
.x-send:disabled { opacity:.4; }

/* Desktop/mobile responsive */
@media (max-width: 560px) {
  .x-bubble { font-size: 12.8px; padding: 9px 12px; }
  .x-msgs { padding: 12px 10px; gap: 8px; }
}
</style>

<div class="x-shell">
  <!-- Header : logo + titre. Laisse passer le fond animé -->
  <div class="x-head">
    <a class="x-back" href="../index.html" aria-label="Retour">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="x-avatar"><img src="../images/assistant.png" alt="Xeumon"></div>
    <div style="flex:1">
      <div class="x-head-name">Xeumon</div>
      <div class="x-head-sub">Assistante officielle Nethxeum</div>
    </div>
    <div class="x-status"><div class="x-dot"></div><span class="x-status-txt">En ligne</span></div>
  </div>

  <!-- zone messages : pas de fond solide, le background du site passe partout -->
  <div id="nxy-msgs" class="x-msgs"></div>

  <form id="nxy-form" class="x-run" onsubmit="return nxySend(event);">
    <input id="nxy-input" class="x-input" type="text" autocomplete="off" placeholder="Écrivez votre message…" />
    <button id="nxy-send" class="x-send" type="submit" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
</div>

<script src="../js/main.js"></script>
<script>
(function() {
  var API = 'https://explore.nethxeum.com/api/assistant/chat';
  var KEY = 'jir63n28vug95behsqofwmpaytk47dczxl10';
  var msgs = document.getElementById('nxy-msgs');
  var input = document.getElementById('nxy-input');

  function now() { var d = new Date(); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }
  function cls(t) {
    return (t || '').replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1').replace(/__(.+?)__/g,'$1').replace(/_(.+?)_/g,'$1').replace(/`{1,3}([^`]+)`{0,3}/g,'$1').replace(/^#{1,6}\s*/gm,'').replace(/^\s*[-*]\s+/gm,'• ').trim();
  }

  function user_api(text, history) {
    return fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': KEY },
      body: JSON.stringify({ message: text, history: history })
    }).then(r => r.json()).then(data => (data.reply || 'Pas de réponse.').replace(/\*\*(.+?)\*\*/g,'$1'));
  }

  function addMsg(role, text, time) {
    var row = document.createElement('div'); row.className = 'x-row' + (role === 'user' ? ' x-user' : '');
    var bundle = document.createElement('div'); bundle.className = 'x-msg-bundle';
    bundle.innerHTML = (role === 'user'
      ? '<div class="x-bubble x-bubble--user">' + cls(text) + '</div>'
      : '<div class="x-bubble x-bubble--bot">' + cls(text) + '</div>')
      + '<div class="x-meta">' + time + (role === 'user' ? '<span class="x-tick">✓✓</span>' : '') + '</div>';
    row.appendChild(bundle);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  var hist = [];
  try { hist = JSON.parse(sessionStorage.getItem('xeumon-history') || '[]'); } catch (e) { hist = []; }

  // Chat de réactivation (basé sur l'historique) présent en premier
  hist.forEach(function (m) {
    addMsg(m.role === 'assistant' ? 'assistant' : 'user', m.content, '');
  });

  if (!hist.length) {
    addMsg('assistant', 'Bonjour ! Je suis Xeumon, l\'assistante de Nethxeum. Je peux tb\'indiquer la hauteur actuelle des blocs, info sur la chaîne ou la page. Si tu préfères, pose-moi une question.', now());
  }

  window.nxySend = function () {
    var text = input.value.trim();
    if (!text) return false;
    addMsg('user', text, now());
    hist.push({ role: 'user', content: text });
    input.value = '';
    input.disabled = true;
    var sendBtn = document.getElementById('nxy-send');
    sendBtn.disabled = true;

    var typing = document.createElement('div'); typing.className = 'x-row'; typing.id = 'typing';
    typing.innerHTML = '<div class="x-msg-bundle"><div class="x-bubble x-bubble--bot">…</div></div>';
    msgs.appendChild(typing); msgs.scrollTop = msgs.scrollHeight;

    user_api(text, hist)
      .then(function (reply) {
        typing.remove();
        addMsg('assistant', reply, now());
        hist.push({ role: 'assistant', content: reply });
        if (hist.length > 20) hist = hist.slice(-20);
        sessionStorage.setItem('xeumon-history', JSON.stringify(hist));
      })
      .catch(function () {
        typing.remove();
        addMsg('assistant', 'Erreur réseau — réessaie dans un instant.', now());
      })
      .finally(function () { input.disabled = false; sendBtn.disabled = false; input.focus(); });
    return false;
  };
})();
</script>
</body>
</html>
