<script src="../js/nxy-assistant.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://explore.nethxeum.com/api/assistant/chat';
  var KEY = 'jir63n28vug95behsqofwmpaytk47dczxl10';

  var msgs = document.getElementById('nxy-page-msgs');
  var form = document.getElementById('nxy-page-form');
  var input = document.getElementById('nxy-page-input');

  function clean(t) {
    return (t || '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/__(.+?)__/g, '$1')
      .replace(/_(.+?)_/g, '$1')
      .replace(/`{1,3}([^`]+)`{0,3}/g, '$1')
      .replace(/^#{1,6}\s*/gm, '')
      .trim();
  }

  function add(role, text) {
    var d = document.createElement('div');
    d.textContent = clean(text);
    d.style.cssText = role === 'user'
      ? 'align-self:flex-end;max-width:82%;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;padding:10px 14px;border-radius:14px;border-bottom-right-radius:4px;white-space:pre-wrap;line-height:1.55;font-size:.94rem;'
      : 'align-self:flex-start;max-width:82%;background:rgba(124,58,237,.13);border:1px solid rgba(124,58,237,.25);color:var(--text-primary);padding:10px 14px;border-radius:14px;border-bottom-left-radius:4px;white-space:pre-wrap;line-height:1.55;font-size:.94rem;';
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  var history = [];
  try { history = JSON.parse(sessionStorage.getItem('xeumon-history') || '[]'); } catch (_) { history = []; }
  history.forEach(function (m) { add(m.role, m.content); });
  if (!history.length) {
    add('assistant', 'Hi! I am Xeumon, the official Nethxeum assistant. I can show you live chain data (blocks, transactions, hashrate) and answer questions about the project.');
    history.push({ role: 'assistant', content: 'Hi! I am Xeumon, the official Nethxeum assistant.' });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    add('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    input.disabled = true;
    var tip = document.createElement('div');
    tip.textContent = 'Xeumon is typing...';
    tip.style.cssText = 'align-self:flex-start;color:var(--text-muted);font-size:.8rem;padding:4px 6px;';
    msgs.appendChild(tip);

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': KEY },
      body: JSON.stringify({ message: text, history: history }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        tip.remove();
        var reply = d.reply || 'No answer.';
        add('assistant', reply);
        history.push({ role: 'assistant', content: reply });
        if (history.length > 20) history = history.slice(-20);
        try { sessionStorage.setItem('xeumon-history', JSON.stringify(history)); } catch (_) {}
      })
      .catch(function () { tip.remove(); add('assistant', 'Network error â€” try again in a moment.'); })
      .finally(function () { input.disabled = false; input.focus(); });
  });
})();
</script>
